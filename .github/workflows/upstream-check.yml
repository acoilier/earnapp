name: upstream-check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: true

jobs:
  installer-checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check installer checksum
        id: check
        shell: bash
        continue-on-error: true
        run: |
          bash scripts/check-installer.sh | tee /tmp/check.txt

      - name: Open issue when upstream installer changed
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/check.txt', 'utf8') + `\n\nAction requise: auditer le nouveau script EarnApp, puis mettre à jour EARNAPP_INSTALL_SHA256 dans Dockerfile, .env.example, Makefile et les workflows.`;
            const title = 'EarnApp installer checksum changed';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-change'
            });
            if (!issues.find(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-change', 'security-review']
              });
            }
