name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed="$(git diff --name-only "$base"...HEAD)"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            else
              changed="$(git diff --name-only "$before" HEAD)"
            fi
          fi

          printf 'Changed files:\n%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(Dockerfile|entrypoint\.sh|docker-compose\.yml|\.dockerignore|\.env\.example|Makefile|scripts/|\.github/workflows/ci\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped heavy checks
        if: steps.changes.outputs.build != 'true'
        run: |
          echo "No build-relevant files changed. Skipping checksum, Docker build and Trivy scan."

      - name: Check pinned EarnApp installer checksum
        if: steps.changes.outputs.build == 'true'
        run: bash scripts/check-installer.sh

      - name: Validate compose file
        if: steps.changes.outputs.build == 'true'
        run: docker compose config >/dev/null

      - name: Build local image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: earnapp-safe:test
          build-args: |
            EARNAPP_INSTALL_SHA256=ff6647905a43245bac71edce3d3a49bab72e0ef5a17c6a42fdebe2c14b37261e
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.sha }}

      - name: Scan image with Trivy
        if: steps.changes.outputs.build == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: earnapp-safe:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
