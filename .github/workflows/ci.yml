name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned EarnApp installer checksum
        run: bash scripts/check-installer.sh

      - name: Validate compose file
        run: docker compose config >/dev/null

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: earnapp-safe:test
          build-args: |
            EARNAPP_INSTALL_SHA256=ff6647905a43245bac71edce3d3a49bab72e0ef5a17c6a42fdebe2c14b37261e
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: earnapp-safe:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
