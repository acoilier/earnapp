services:
  earnapp:
    image: ${EARNAPP_IMAGE:-docker.io/acoilier/earnapp:latest}
    build:
      context: .
      args:
        EARNAPP_INSTALL_URL: ${EARNAPP_INSTALL_URL:-https://brightdata.com/static/earnapp/install.sh}
        EARNAPP_INSTALL_SHA256: ${EARNAPP_INSTALL_SHA256:-ff6647905a43245bac71edce3d3a49bab72e0ef5a17c6a42fdebe2c14b37261e}
    container_name: earnapp
    restart: unless-stopped
    environment:
      EARNAPP_UUID: ${EARNAPP_UUID:-}
      EARNAPP_REFERRAL_CODE: ${EARNAPP_REFERRAL_CODE:-}
    volumes:
      - earnapp_data:/etc/earnapp
    tmpfs:
      - /tmp:exec,mode=1777
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  earnapp_data:
